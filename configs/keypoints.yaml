seed: 0
deterministic: true

data:
  pack: data/keypoints.npz            # собирается python -m dxa_qc.pack
  folds: folds.csv
  spine_edges: true                   # false → 13 точек позвоночника вместо 21
  canvas: [352, 320]                  # покрывает все обучающие снимки (максимум 349×300)
  mm_per_px: 0.6
  use_clahe: false                    # решается аблацией
  scale: 1                            # 2 → холст ×2, эксперимент

model:
  pretrained: true                    # веса ImageNet, если доступен torchvision
  decoder_channels: [256, 128, 64, 32, 16]

loss:
  alpha: 2.0
  beta: 4.0
  soft_mask_weight: 0.15              # чужая область обучается нулевым картам

heatmap:
  sigma: 2.0                          # 95% массы в радиусе 4.9 px
  decode_window: 11                   # soft-argmax, ±2.5σ

augment:
  enabled: true
  rotation_deg: 15.0                  # шире порога 5°, иначе модель решит, что ось вертикальна
  shift_frac: 0.10                    # заодно синтезирует случаи «структура за кадром»
  scale: 0.10
  brightness: 0.20
  contrast: 0.20
  gamma: [0.8, 1.25]
  noise_std: 4.0
  blur_sigma: 0.6
  p_geometric: 0.9
  p_intensity: 0.7
  p_hflip_spine: 0.5                  # бедро не отражаем: оно приведено к левому

train:
  folds: [0, 1, 2, 3, 4]
  epochs: 300
  batch_size: 16
  num_workers: 4
  lr_encoder: 3.0e-5
  lr_decoder: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  patience: 50                        # ранняя остановка по медианной ошибке в мм
  checkpoint_every: 10                # как часто писать fold{N}_last.pt для продолжения
  ema_decay: 0.999
  amp: false                          # титаны могут быть Pascal
  out_dir: runs/keypoints

infer:
  visibility_threshold: 0.3           # калибруется на OOF, отдельно по каждой точке
  tta_rotations: [-5, 0, 5]
  tta_flip_spine: true                # с обратной перестановкой каналов
